[project]
name = "grocery-deals"
version = "0.1.0"
description = "Find the cheapest grocery deals in Berlin from kaufDA brochure offers"
requires-python = ">=3.11"
# Dependencies are added phase by phase as they're actually used.
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "typer>=0.12",
    "rich>=13",
    "rapidfuzz>=3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# Optional embedding reranker (pulls in torch; ~1 GB). Off by default, see docs/matching.md.
semantic = ["sentence-transformers>=3"]
# Web UI (Phase 7): deals ui
ui = ["streamlit>=1.30"]

[project.scripts]
deals = "deals.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
